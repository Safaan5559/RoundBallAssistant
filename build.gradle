plugins {
    id 'fabric-loom' version '1.9-SNAPSHOT'
    id 'maven-publish'
}

version = project.mod_version
group = project.maven_group
base { archivesName = project.archives_base_name }

repositories {
    maven { url = 'https://maven.fabricmc.net/' }
    mavenCentral()
}

dependencies {
    minecraft "com.mojang:minecraft:${project.minecraft_version}"
    mappings "net.fabricmc:yarn:${project.yarn_mappings}:v2"
    modImplementation "net.fabricmc:fabric-loader:${project.loader_version}"
    modImplementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_version}"
}

tasks.register('generateRoundBallTexture') {
    outputs.file(layout.projectDirectory.file('src/main/resources/assets/roundballassistant/textures/entity/round_ball.png'))
    doLast {
        def out = layout.projectDirectory.file('src/main/resources/assets/roundballassistant/textures/entity/round_ball.png').asFile
        out.parentFile.mkdirs()
        def image = new java.awt.image.BufferedImage(64, 64, java.awt.image.BufferedImage.TYPE_INT_ARGB)
        def g = image.createGraphics()
        g.setColor(new java.awt.Color(255, 220, 40, 255)); g.fillRect(0, 0, 64, 64)
        g.setColor(new java.awt.Color(35, 35, 20, 255))
        g.fillOval(14, 14, 10, 14); g.fillOval(40, 14, 10, 14)
        g.setStroke(new java.awt.BasicStroke(4)); g.drawArc(14, 20, 36, 30, 10, 160)
        g.dispose()
        javax.imageio.ImageIO.write(image, 'png', out)
    }
}

processResources {
    dependsOn tasks.named('generateRoundBallTexture')
    inputs.property 'version', project.version
    filesMatching('fabric.mod.json') { expand 'version': project.version }
}

tasks.withType(JavaCompile).configureEach { it.options.release = 21 }
java { withSourcesJar(); sourceCompatibility = JavaVersion.VERSION_21; targetCompatibility = JavaVersion.VERSION_21 }
jar { from('LICENSE') { rename { "${it}_${project.archives_base_name}" } } }
publishing { publications { create('mavenJava', MavenPublication) { from components.java } } }
